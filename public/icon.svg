<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45e494" />
      <stop offset="100%" stop-color="#1db954" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#13231a" />
      <stop offset="100%" stop-color="#0a0f0d" />
    </radialGradient>
  </defs>
  
  <!-- Fondo redondeado suave -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#45e494" stroke-width="8" stroke-opacity="0.25" />
  
  <!-- Círculo exterior brillante -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#brandGrad)" stroke-width="14" stroke-opacity="0.9" />
  <circle cx="256" cy="256" r="170" fill="#45e494" fill-opacity="0.05" />

  <!-- Cancha / Red interior -->
  <line x1="86" y1="256" x2="426" y2="256" stroke="#45e494" stroke-width="8" stroke-opacity="0.6" />
  <circle cx="256" cy="256" r="56" fill="none" stroke="#45e494" stroke-width="8" stroke-opacity="0.8" />
  <circle cx="256" cy="256" r="14" fill="url(#brandGrad)" />
  
  <!-- Rayo dinámico o balón central -->
  <path d="M246 140 L280 230 L250 230 L270 340 L226 260 L254 260 Z" fill="url(#brandGrad)" opacity="0.9" />
</svg>
